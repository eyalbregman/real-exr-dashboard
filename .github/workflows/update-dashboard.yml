name: Update Dashboard

on:
  schedule:
    # Every day at 06:00 UTC. fetch_and_build.py always fetches fresh data
    # but only adopts it (and only then does this workflow commit/redeploy)
    # once every price index has actually advanced to a new common month --
    # there is no day-of-month rule to satisfy first.
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Adopt freshly-fetched data even if no new common month is available (e.g. to pick up a revision)'
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run dashboard update
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: |
          if [ "${{ inputs.force }}" = "true" ]; then
            python fetch_and_build.py --force
          else
            python fetch_and_build.py
          fi

      - name: Commit updated data if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html data_cache.json
          git diff --cached --quiet || git commit -m "Auto-update dashboard data"
          git push

      # index.html is always regenerated from the current template, using
      # either freshly-adopted data or (when no new common month is
      # available yet) the existing cached data -- either way a valid file
      # is always present here, so Pages never goes blank.
      - name: Prepare Pages site
        run: |
          mkdir -p _site
          cp index.html _site/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
